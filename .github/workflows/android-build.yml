name: Android CI (Precompiled SO Build)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch: # 允许你在 GitHub 页面上点击手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # Gradle packages the committed jniLibs as they are; the Rust core is built
      # with scripts/build
      - name: Run Unit Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TS6-Han-Android-App
          path: app/build/outputs/apk/debug/app-debug.apk